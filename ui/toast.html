<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kestryl alert</title>
<link rel="stylesheet" href="app.css">
<style>
  body { display: block; background: var(--side); border: 1px solid var(--line); height: 100vh; overflow: hidden; user-select: none; }
  .t { height: 100%; }
  .in { height: 100%; padding: 11px 14px 12px 16px; display: flex; flex-direction: column; min-width: 0; }
  .label { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--tx3); }
  .label .bm { width: 16px; height: 16px; background: url(brand-mark.png) center / contain no-repeat; }
  .label b { font-weight: 600; color: var(--low); }
  .label b::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .t.s3 .label b { color: var(--high); }
  .t.s2 .label b { color: var(--med); }
  .label .x { margin-left: auto; border: 0; background: none; color: var(--tx3); cursor: pointer; font: 11px/1 'Segoe Fluent Icons', 'Segoe MDL2 Assets'; padding: 4px; border-radius: 4px; }
  .label .x:hover { color: var(--tx); background: var(--hover); }
  .title { margin-top: 5px; font-weight: 600; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: 3px; font-size: 12px; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { margin-top: auto; padding-top: 8px; display: flex; gap: 8px; align-items: center; }
  .msg { color: var(--tx2); font-size: 12px; }
</style>
</head>
<body>
<div class="t" id="t">
  <div class="in">
    <div class="label"><span class="bm"></span><b id="sev"></b><span id="more"></span><button class="x" id="x" title="Dismiss">&#xE711;</button></div>
    <div class="title" id="title"></div>
    <div class="meta" id="meta"></div>
    <div class="actions" id="actions">
      <button class="btn dangerf" id="block">Block app</button>
      <button class="btn" id="details">Details</button>
    </div>
  </div>
</div>
<script src="toast.js"></script>
</body>
</html>
