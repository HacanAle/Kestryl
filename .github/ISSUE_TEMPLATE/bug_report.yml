name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **leave out personal data**: your user name in paths, IP addresses you don't want public, names of your files.
        Security problems go to [private reporting](https://github.com/HacanAle/Kestryl/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Kestryl version
      placeholder: "1.8.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Win+R → winver"
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Installed with the setup
        - Portable exe
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode shown in the header
      options:
        - Full (administrator)
        - Limited mode
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: Settings → Diagnostics (mode, events, errors). Screenshots help too, with personal data hidden.
