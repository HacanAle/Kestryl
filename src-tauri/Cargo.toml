[package]
name = "kestryl"
version = "1.7.9"
description = "Kestryl: network security monitor for Windows"
edition = "2021"

[lib]
name = "kestryl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ferrisetw = "1"
netstat2 = "0.11"
sysinfo = "0.37"
tauri-plugin-single-instance = "2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
# Country / company data (DB-IP Lite) comes gzip-compressed.
flate2 = "1"
# HTTPS decryption sessions: a local TLS-terminating proxy with a temporary certificate
# authority made in memory for each session (ring backend: no cmake/NASM needed).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
argon2 = "0.5"

[target."cfg(windows)".dependencies]
winreg = "0.55"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_System_Diagnostics_Etw", "Win32_System_Services", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_StationsAndDesktops", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Networking_WinInet", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = 2
strip = true
